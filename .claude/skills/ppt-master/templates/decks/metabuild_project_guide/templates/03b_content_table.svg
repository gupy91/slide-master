<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720"
     data-pptx-master="master-default" data-pptx-master-name="기본 마스터"
     data-pptx-layout="content" data-pptx-layout-name="본문">
  <rect id="master-bg" data-pptx-layer="master" data-pptx-editable="false" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <image id="layout-content-band" data-pptx-layer="layout" data-pptx-editable="false"
         href="../images/header_band.png" x="0" y="0" width="1280" height="92" preserveAspectRatio="none"/>
  <rect id="layout-content-underline" data-pptx-layer="layout" data-pptx-editable="false" x="0" y="92" width="1280" height="4" fill="#C00000"/>
  <image id="layout-content-logo" data-pptx-layer="layout" data-pptx-editable="false"
         href="../images/logo_mark.png" x="1140" y="682" width="100" height="25.6" preserveAspectRatio="none"/>

  <g id="title-slot" data-pptx-placeholder="title" data-pptx-placeholder-bounds="56 20 1168 56">
    <text id="title-carrier" data-pptx-placeholder-carrier="true" x="56" y="58" text-anchor="start"
          xml:space="preserve" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="26"
          font-weight="bold" fill="#FFFFFF">{{PAGE_TITLE}}</text>
  </g>

  <g id="content-block-table">
    <rect x="56" y="150" width="120" height="36" fill="#DEEBF7" stroke="#808080" stroke-width="1"/>
    <rect x="176" y="150" width="150" height="36" fill="#DEEBF7" stroke="#808080" stroke-width="1"/>
    <rect x="326" y="150" width="738" height="36" fill="#DEEBF7" stroke="#808080" stroke-width="1"/>
    <rect x="1064" y="150" width="160" height="36" fill="#DEEBF7" stroke="#808080" stroke-width="1"/>
    <text x="116" y="173" text-anchor="middle" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="13" font-weight="bold" fill="#262626">버전</text>
    <text x="251" y="173" text-anchor="middle" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="13" font-weight="bold" fill="#262626">개정일자</text>
    <text x="695" y="173" text-anchor="middle" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="13" font-weight="bold" fill="#262626">개정내용</text>
    <text x="1144" y="173" text-anchor="middle" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="13" font-weight="bold" fill="#262626">작성자</text>

    <rect x="56" y="186" width="120" height="36" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <rect x="176" y="186" width="150" height="36" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <rect x="326" y="186" width="738" height="36" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <rect x="1064" y="186" width="160" height="36" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="116" y="209" text-anchor="middle" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="13" fill="#262626">{{TABLE_R1_C1}}</text>
    <text x="251" y="209" text-anchor="middle" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="13" fill="#262626">{{TABLE_R1_C2}}</text>
    <text x="330" y="209" text-anchor="start" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="13" fill="#262626">{{TABLE_R1_C3}}</text>
    <text x="1144" y="209" text-anchor="middle" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="13" fill="#262626">{{TABLE_R1_C4}}</text>

    <rect x="56" y="222" width="120" height="36" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <rect x="176" y="222" width="150" height="36" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <rect x="326" y="222" width="738" height="36" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <rect x="1064" y="222" width="160" height="36" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="116" y="245" text-anchor="middle" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="13" fill="#262626">{{TABLE_R2_C1}}</text>
    <text x="251" y="245" text-anchor="middle" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="13" fill="#262626">{{TABLE_R2_C2}}</text>
    <text x="330" y="245" text-anchor="start" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="13" fill="#262626">{{TABLE_R2_C3}}</text>
    <text x="1144" y="245" text-anchor="middle" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="13" fill="#262626">{{TABLE_R2_C4}}</text>
  </g>

  <g id="body-slot" data-pptx-placeholder="body" data-pptx-placeholder-idx="1" data-pptx-placeholder-bounds="56 120 1168 550">
    <text id="body-carrier" data-pptx-placeholder-carrier="true" x="70" y="450" text-anchor="start"
          xml:space="preserve" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="16"
          fill="#8C8C8C">{{CONTENT_AREA}}</text>
  </g>

  <g id="pagenum-slot" data-pptx-placeholder="slide-number" data-pptx-placeholder-idx="9" data-pptx-placeholder-bounds="540 682 200 26">
    <text id="pagenum-carrier" data-pptx-placeholder-carrier="true" x="640" y="700" text-anchor="middle"
          xml:space="preserve" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="13"
          fill="#595959"><tspan>- </tspan><tspan>{{PAGE_NUM}}</tspan><tspan> -</tspan></text>
  </g>
</svg>
