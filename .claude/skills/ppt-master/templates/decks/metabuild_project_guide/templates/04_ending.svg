<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720"
     data-pptx-master="master-default" data-pptx-master-name="기본 마스터"
     data-pptx-layout="ending" data-pptx-layout-name="마무리">
  <rect id="master-bg" data-pptx-layer="master" data-pptx-editable="false" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect id="layout-ending-bg" data-pptx-layer="layout" data-pptx-editable="false" x="0" y="0" width="1280" height="720" fill="#ED7D31"/>
  <image id="layout-ending-logo" data-pptx-layer="layout" data-pptx-editable="false"
         href="../images/logo_wordmark.png" x="580" y="620" width="120" height="39.5" preserveAspectRatio="none"/>

  <g id="title-slot" data-pptx-placeholder="title" data-pptx-placeholder-bounds="240 260 800 90">
    <text id="title-carrier" data-pptx-placeholder-carrier="true" x="640" y="322" text-anchor="middle"
          xml:space="preserve" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="44"
          font-weight="bold" fill="#FFFFFF">{{THANK_YOU}}</text>
  </g>

  <g id="subtitle-slot" data-pptx-placeholder="subtitle" data-pptx-placeholder-idx="1" data-pptx-placeholder-bounds="240 360 800 40">
    <text id="subtitle-carrier" data-pptx-placeholder-carrier="true" x="640" y="386" text-anchor="middle"
          xml:space="preserve" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="18"
          fill="#FFF3E8">{{CLOSING_MESSAGE}}</text>
  </g>

  <g id="body-slot" data-pptx-placeholder="body" data-pptx-placeholder-idx="2" data-pptx-placeholder-bounds="240 560 800 40">
    <text id="body-carrier" data-pptx-placeholder-carrier="true" x="640" y="582" text-anchor="middle"
          xml:space="preserve" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="14"
          fill="#FFFFFF">{{CONTACT_INFO}}</text>
  </g>

  <g id="pagenum-slot" data-pptx-placeholder="slide-number" data-pptx-placeholder-idx="9" data-pptx-placeholder-bounds="540 682 200 26">
    <text id="pagenum-carrier" data-pptx-placeholder-carrier="true" x="640" y="700" text-anchor="middle"
          xml:space="preserve" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="13"
          fill="#FFF3E8"><tspan>- </tspan><tspan>{{PAGE_NUM}}</tspan><tspan> -</tspan></text>
  </g>
</svg>
