<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720"
     data-pptx-master="master-default" data-pptx-master-name="기본 마스터"
     data-pptx-layout="content_info_card" data-pptx-layout-name="본문 - 노트 패널">
  <rect id="master-bg" data-pptx-layer="master" data-pptx-editable="false" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <image id="layout-card-band" data-pptx-layer="layout" data-pptx-editable="false"
         href="../images/header_band.png" x="0" y="0" width="1280" height="92" preserveAspectRatio="none"/>
  <rect id="layout-card-underline" data-pptx-layer="layout" data-pptx-editable="false" x="0" y="92" width="1280" height="4" fill="#C00000"/>
  <image id="layout-card-logo" data-pptx-layer="layout" data-pptx-editable="false"
         href="../images/logo_mark.png" x="1140" y="682" width="100" height="25.6" preserveAspectRatio="none"/>
  <rect id="layout-card-panel" data-pptx-layer="layout" data-pptx-editable="false" x="56" y="150" width="300" height="490" fill="#F2F2F2" stroke="#BFBFBF" stroke-width="1"/>
  <rect id="layout-card-tab" data-pptx-layer="layout" data-pptx-editable="false" x="56" y="120" width="78" height="30" fill="#ED7D31"/>
  <text id="layout-card-tab-label" data-pptx-layer="layout" data-pptx-editable="false" x="95" y="140" text-anchor="middle"
        font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="13" fill="#FFFFFF">Key notes</text>

  <g id="title-slot" data-pptx-placeholder="title" data-pptx-placeholder-bounds="56 20 1168 56">
    <text id="title-carrier" data-pptx-placeholder-carrier="true" x="56" y="58" text-anchor="start"
          xml:space="preserve" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="26"
          font-weight="bold" fill="#FFFFFF">{{PAGE_TITLE}}</text>
  </g>

  <g id="notes-slot" data-pptx-placeholder="body" data-pptx-placeholder-idx="1" data-pptx-placeholder-bounds="80 190 260 430">
    <text id="notes-carrier" data-pptx-placeholder-carrier="true" x="80" y="211" xml:space="preserve"
          font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="13" fill="#C00000">§ {{KEY_NOTE_1}}</text>
  </g>
  <g id="notes-extra">
    <text x="80" y="237" font-size="13" fill="#C00000" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif">§ {{KEY_NOTE_2}}</text>
    <text x="80" y="263" font-size="13" fill="#C00000" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif">§ {{KEY_NOTE_3}}</text>
  </g>

  <g id="body-slot" data-pptx-placeholder="body" data-pptx-placeholder-idx="2" data-pptx-placeholder-bounds="390 120 834 550">
    <text id="body-carrier" data-pptx-placeholder-carrier="true" x="390" y="150" text-anchor="start"
          xml:space="preserve" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="16"
          fill="#8C8C8C">{{CONTENT_AREA}}</text>
  </g>

  <g id="pagenum-slot" data-pptx-placeholder="slide-number" data-pptx-placeholder-idx="9" data-pptx-placeholder-bounds="540 682 200 26">
    <text id="pagenum-carrier" data-pptx-placeholder-carrier="true" x="640" y="700" text-anchor="middle"
          xml:space="preserve" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="13"
          fill="#595959"><tspan>- </tspan><tspan>{{PAGE_NUM}}</tspan><tspan> -</tspan></text>
  </g>
</svg>
