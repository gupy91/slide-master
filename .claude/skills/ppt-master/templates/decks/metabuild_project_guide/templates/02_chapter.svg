<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720"
     data-pptx-master="master-default" data-pptx-master-name="기본 마스터"
     data-pptx-layout="chapter" data-pptx-layout-name="챕터 구분">
  <rect id="master-bg" data-pptx-layer="master" data-pptx-editable="false" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <image id="layout-chapter-band" data-pptx-layer="layout" data-pptx-editable="false"
         href="../images/header_band.png" x="0" y="0" width="1280" height="160" preserveAspectRatio="none"/>
  <image id="layout-chapter-logo" data-pptx-layer="layout" data-pptx-editable="false"
         href="../images/logo_mark.png" x="1140" y="682" width="100" height="25.6" preserveAspectRatio="none"/>

  <g id="title-slot" data-pptx-placeholder="title" data-pptx-placeholder-bounds="56 56 1168 80">
    <text id="title-carrier" data-pptx-placeholder-carrier="true" x="56" y="112" text-anchor="start"
          xml:space="preserve" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="42"
          font-weight="bold" fill="#FFFFFF"><tspan>{{CHAPTER_NUM}} </tspan><tspan>{{CHAPTER_TITLE}}</tspan></text>
  </g>

  <g id="subtitle-slot" data-pptx-placeholder="subtitle" data-pptx-placeholder-idx="1" data-pptx-placeholder-bounds="56 190 1168 60">
    <text id="subtitle-carrier" data-pptx-placeholder-carrier="true" x="56" y="222" text-anchor="start"
          xml:space="preserve" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="16"
          fill="#595959">{{CHAPTER_DESC}}</text>
  </g>

  <g id="pagenum-slot" data-pptx-placeholder="slide-number" data-pptx-placeholder-idx="9" data-pptx-placeholder-bounds="540 682 200 26">
    <text id="pagenum-carrier" data-pptx-placeholder-carrier="true" x="640" y="700" text-anchor="middle"
          xml:space="preserve" font-family="Pretendard, &quot;Malgun Gothic&quot;, sans-serif" font-size="13"
          fill="#595959"><tspan>- </tspan><tspan>{{PAGE_NUM}}</tspan><tspan> -</tspan></text>
  </g>
</svg>
